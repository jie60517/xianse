<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顯色</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <section class="bench" aria-label="照片">
    <header class="rebate rebate-top">
      <span class="mark">顯色</span>
      <span class="rebate-note" id="fileNote">先量測，再調色</span>
      <span class="rebate-right" id="sizeNote"></span>
    </header>

    <div class="stage" id="stage">
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
        <span class="drop-title">把照片拖進來，或點這裡選檔</span>
        <span class="drop-sub">JPEG、PNG、WebP。照片只在這台電腦上處理，不會上傳。</span>
      </label>

      <div class="viewer" id="viewer" hidden>
        <canvas id="after"></canvas>
        <canvas id="before"></canvas>
        <div class="split" id="split" role="slider" tabindex="0" aria-label="原圖與結果的分界" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span></span></div>
        <span class="tag tag-l">原圖</span><span class="tag tag-r">結果</span>
        <div class="busy" id="busy" hidden>處理中</div>
      </div>
    </div>

    <footer class="rebate rebate-bottom" id="strip" aria-label="各亮度帶的色彩量"></footer>
  </section>

  <aside class="panel" aria-label="調整">
    <div class="group">
      <div class="row">
        <label for="strength">顏色強度</label><output id="strengthOut">1.5</output>
      </div>
      <input type="range" id="strength" min="0" max="2" step="0.05" value="1.5">
      <p class="hint">1.5 是建議值。超過 1.8 顏色會開始變重。</p>
    </div>

    <div class="group" id="fxGroup">
      <div class="row">
        <label class="check"><input type="checkbox" id="fxOn" checked> 底片質感</label>
        <button type="button" class="ghost" id="reseed">換一組顆粒</button>
      </div>
      <div id="fxSliders"></div>
      <p class="hint" id="fxMissing" hidden>底片質感模組尚未載入，目前只處理顏色。</p>
    </div>

    <div class="group readout" id="readout" hidden>
      <h2>這張照片的量測</h2>
      <dl id="facts"></dl>
    </div>

    <div class="group actions">
      <button type="button" class="primary" id="download" disabled>下載 JPEG</button>
      <button type="button" class="ghost" id="another" hidden>換一張照片</button>
      <p class="hint" id="status" role="status"></p>
    </div>
  </aside>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
